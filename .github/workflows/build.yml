name: Build & Deploy

# Cron runs more often than needed; the build script (shouldRun) gates on
# exact local time in America/Chicago (6am or 1pm) and exits cleanly otherwise.
# This is DST-safe year-round without juggling separate cron entries.
#
# UTC times covered:
#   11:00 UTC = 6am CDT (Mar–Nov) — RUN
#   12:00 UTC = 6am CST (Nov–Mar) — RUN
#   18:00 UTC = 1pm CDT (Mar–Nov) — RUN
#   19:00 UTC = 1pm CST (Nov–Mar) — RUN
on:
  schedule:
    # Wide net to absorb GitHub Actions cron drift (often 15+ min late, sometimes
    # whole hours dropped under load). Targets: 6am and 1pm America/Chicago, both
    # DST states. The gate widens to a 2-hour window per target and the build
    # script's idempotency check skips runs that follow a recent successful build,
    # so we get redundancy without double-running.
    #
    #   CDT (UTC-5): 6am=11Z, 1pm=18Z   |   CST (UTC-6): 6am=12Z, 1pm=19Z
    #   Window each side adds the next hour to absorb drift.
    - cron: '0 11,12,13,18,19,20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run regardless of time gate'
        required: false
        default: 'true'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  # Time-gate job. The cron fires at 4 UTC times so that one of them is
  # always exactly 6am or 1pm America/Chicago across DST. The other 2-3
  # firings should NO-OP — without this gate, they would deploy an empty
  # public/ and 404 the live site (which is exactly what happened on
  # 2026-04-26 13:01 UTC). Manual workflow_dispatch with force=true
  # bypasses the gate.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        name: Check Chicago hour
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Force-run requested, bypassing time gate."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          h=$(TZ=America/Chicago date +%H)
          echo "Chicago hour: $h"
          # 2-hour windows per target absorb GitHub Actions cron drift.
          # Build script runs an idempotency check so we don't double-build.
          if [ "$h" = "06" ] || [ "$h" = "07" ] || [ "$h" = "13" ] || [ "$h" = "14" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false  (skipping — outside 6–7am or 1–2pm Chicago window)" >> "$GITHUB_STEP_SUMMARY"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Generate data.json
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-4-5' }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force == 'true' && '1' || '' }}
        run: npm run build:data

      - name: Verify data.json was written
        run: |
          if [ ! -s public/data.json ]; then
            echo "::error::public/data.json was not written. Refusing to deploy."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
